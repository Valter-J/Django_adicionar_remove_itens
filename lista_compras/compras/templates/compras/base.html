{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lista de compras{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'compras/style.css' %}">
</head>
<body>
    <div class="card">
        {% if messages %}
            <ul class="mensagens">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
